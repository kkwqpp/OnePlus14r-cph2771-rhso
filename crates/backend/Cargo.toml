[package]
name = "rhso-backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "rhso"

[[bin]]
name = "walletdiag"
path = "src/main.rs"

[dependencies]
rhso-keybox = { path = "../keybox" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
regex.workspace = true
time.workspace = true
rand = "0.8"
base64 = "0.22"
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "1"
url = "2"
zeroize = "1"
httpdate = "1"
mime = "0.3"
quick-xml = "0.38"

[dev-dependencies]
tempfile = "3"
rcgen = { version = "0.13.2", features = ["pem", "ring"] }
p256 = { version = "0.13.2", features = ["pkcs8", "pem"] }
