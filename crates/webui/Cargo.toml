[package]
name = "rhso-webui"
version = "0.3.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.108"
wasm-bindgen-futures = "=0.4.58"
js-sys = "=0.3.85"
web-sys = { version = "=0.3.85", features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "HtmlButtonElement", "Node", "NodeList", "DomTokenList", "Event", "EventTarget", "BeforeUnloadEvent", "FocusOptions", "ScrollIntoViewOptions", "ScrollLogicalPosition"] }
